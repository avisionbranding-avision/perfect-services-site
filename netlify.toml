[build]
  publish = "."
  command = "node scripts/build.mjs"

[build.environment]
  NODE_VERSION = "20"

# Keep the generator source files out of Google
[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/painel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
[[headers]]
  for = "/data/status.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex"
